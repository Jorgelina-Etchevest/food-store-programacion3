<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Store - Login</title>
  <link rel="stylesheet" crossorigin href="../../../assets/storeLogin-CPHd5UYI.css">
</head>
<body>
    <header>
    <h1>Food Store</h1>
    <nav>
        <ul>
            <li><a href="../store/home/home.html">Volver a la tienda</a></li>        
        </ul>
    </nav>
</header>
<main>
    <div class="container">
        <form class="login-form">
            <h1>FOOD STORE</h1>
            <h2>Iniciar Sesión</h2>

            <label for="email">Email</label>
            <input 
            type="email"
            id="email"
            name="email"
            placeholder="tucorreo@gmail.com"
            required>

            <label for="password">Contraseña</label>
            <input type="password"
            id="password"
            name="password"
            placeholder="Al menos 8 caracteres"
            required>

            <button type="submit">Ingresar</button>
            <p class="registro">¿No tenés cuenta?<a href=""> Registrate acá</a></p>
        </form>
    </div>
</main>
<footer>
    <p> Jorgelina Etchevest. 2026 Food Store. Todos los derechos reservados.</p>
    <p>Contacto:<a href="mailto:info@foodstore.com"> info@foodstore.com</a></p>
</footer>
</body>
</html>
